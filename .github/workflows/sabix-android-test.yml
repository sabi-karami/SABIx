name: SABIx Android test APK
on:
  workflow_dispatch:
  push:
    branches: [sabix-orbit-android]
    paths:
      - .github/workflows/sabix-android-test.yml
      - lib/features/home/widget/connection_button.dart
      - lib/features/home/widget/sabix_orbit_painter.dart
permissions:
  contents: read
concurrency:
  group: sabix-android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: ./.github/actions/setup-flutter
        with:
          platform: android-apk
          install-deps: false
      - name: Analyze orbit changes
        run: flutter analyze --no-pub --no-fatal-infos lib/features/home/widget/sabix_orbit_painter.dart lib/features/home/widget/connection_button.dart
      - name: Build test APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --target-platform android-arm,android-arm64,android-x64 2>&1 | tee "$RUNNER_TEMP/sabix-build.log"; then
              break
            fi
            if [ "$attempt" = 3 ] || ! grep -qiE '429|Too Many Requests' "$RUNNER_TEMP/sabix-build.log"; then
              exit 1
            fi
            sleep "$((25 * attempt))"
          done
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/SABIx-Android-test.apk
          (cd out && sha256sum SABIx-Android-test.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: SABIx-Android-test
          path: out/
          retention-days: 5
          compression-level: 0
          if-no-files-found: error
